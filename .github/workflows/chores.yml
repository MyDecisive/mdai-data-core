name: Chores

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: "binary"
          version: v2.4.0 # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.

  check-go-file-changes:
    name: Check if Go files changed
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      go_files_changed: ${{ steps.check.outputs.go_files_changed }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history to compare commits

      - name: Determine base commit
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_COMMIT="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_COMMIT="$PUSH_BEFORE_SHA"  # Tip of main before this push, so multi-commit pushes are fully covered
          else
            BASE_COMMIT=$(git rev-parse HEAD~1)
          fi
          echo "BASE_COMMIT=$BASE_COMMIT"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

      - name: Check for test-relevant file changes
        id: check
        run: |
          # Go sources (including tests), module files, test fixtures, and the build/lint/mock/CI config the tests depend on
          CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD -- \
            '*.go' 'go.mod' 'go.sum' '*/testdata/*' \
            'Makefile' 'mock/mockery.yml' '.golangci.yml' '.github/workflows/chores.yml' \
            | grep -vE '^vendor/' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No test-relevant file changes detected."
            echo "go_files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Test-relevant file changes detected:"
            echo "$CHANGED_FILES"
            echo "go_files_changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    needs: [lint, check-go-file-changes]
    if: needs.check-go-file-changes.outputs.go_files_changed == 'true'
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: make tidy-check

      - name: Check generated mocks are up to date
        run: make generate-check

      - name: Running Tests
        run: make cover

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          # Secrets are unavailable to fork PRs; don't fail those runs on a missing token.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
