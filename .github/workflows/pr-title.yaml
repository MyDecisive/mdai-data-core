name: PR Title Validate

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  pr-title:
    # Pinned to MyDecisive/changelogs main as of 2026-06-01; bump deliberately to pick up changes.
    uses: MyDecisive/changelogs/.github/workflows/reusable-semantic-pr-title.yaml@a95675bc66585f7ff75f842e099e7e67f4459bc8
    # The reusable workflow only needs GITHUB_TOKEN (always available), so no other secrets are passed.
    # These are the permissions it declares: commenting on the PR and setting the title status.
    permissions:
      pull-requests: write
      statuses: write
