version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Security updates only: Dependabot opens PRs for Go modules with known vulnerabilities.
  # open-pull-requests-limit: 0 disables routine version-bump PRs; it does not limit security PRs.
  # Requires "Dependabot security updates" to be enabled in the repository's security settings.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: security
      include: scope
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
